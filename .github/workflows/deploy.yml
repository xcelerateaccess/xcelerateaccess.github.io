name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          # Set this repository variable to / when using a custom domain.
          ASTRO_BASE_PATH: ${{ vars.ASTRO_BASE_PATH }}
        run: |
          if [ -z "$ASTRO_BASE_PATH" ]; then
            if [ "$REPOSITORY_NAME" = "$REPOSITORY_OWNER.github.io" ]; then
              ASTRO_BASE_PATH="/"
            else
              ASTRO_BASE_PATH="/$REPOSITORY_NAME"
            fi
          fi
          BASE_PATH="$ASTRO_BASE_PATH" npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
